<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Malotes - Operação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-scroll::-webkit-scrollbar { height: 8px; }
        .table-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .linha-destacada { background-color: #eff6ff !important; outline: 2px solid #3b82f6; z-index: 10; position: relative; }
        .cursor-pointer { cursor: pointer; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .bg-fechado { background: repeating-linear-gradient(45deg, #f1f5f9, #f1f5f9 5px, #e2e8f0 5px, #e2e8f0 10px); opacity: 0.8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col">

    <div id="loginModal" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center transition-opacity">
        <div class="bg-white p-8 rounded shadow-2xl w-96 flex flex-col">
            <h2 class="text-2xl font-black text-[#1e3a8a] mb-2 text-center">Acesso Restrito</h2>
            <p class="text-sm text-slate-500 mb-6 text-center">Identifique-se para acessar a operação.</p>
            <input type="text" id="loginUser" placeholder="Usuário" class="border border-slate-300 p-3 rounded mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" id="loginPass" placeholder="Senha" class="border border-slate-300 p-3 rounded mb-6 focus:ring-2 focus:ring-blue-500 outline-none" onkeypress="if(event.key === 'Enter') fazerLogin()">
            <button onclick="fazerLogin()" class="bg-[#1e3a8a] hover:bg-blue-800 text-white font-bold py-3 rounded shadow transition-transform active:scale-95">Entrar</button>
        </div>
    </div>

    <header class="bg-[#1e3a8a] text-white p-4 shadow-md flex justify-between items-center shrink-0">
        <h1 class="text-xl font-bold tracking-wide">Controle de Malotes</h1>
        <div class="flex gap-4 items-center">
            <a href="demanda.html" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm font-bold shadow border border-blue-400 transition-transform hover:scale-105 active:scale-95 flex items-center gap-2">
                📊 Painel de Demanda
            </a>
            <button id="btnConfig" onclick="abrirModalConfig()" class="hidden hover:text-blue-200 text-2xl transition-transform hover:scale-110 active:scale-95" title="Configurações (Master)">⚙️</button>
            <button onclick="fazerLogout()" class="text-sm bg-red-600 hover:bg-red-500 px-3 py-2 rounded font-bold shadow ml-2">Sair</button>
        </div>
    </header>

    <div id="configModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-xl w-[500px] flex flex-col gap-5 max-h-[90vh] overflow-y-auto custom-scroll">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <h2 class="text-sm font-bold text-slate-800 mb-1 border-b pb-1">Data Mestre</h2>
                    <input type="date" id="dataConfig" class="w-full border border-slate-300 p-2 text-sm rounded text-slate-700">
                </div>
                <div>
                    <h2 class="text-sm font-bold text-slate-800 mb-1 border-b pb-1">Meta de Guias (Onda)</h2>
                    <input type="number" id="metaDemandaConfig" placeholder="Ex: 400" class="w-full border border-slate-300 p-2 text-sm rounded text-slate-700 font-bold">
                </div>
            </div>
            <div>
                <h2 class="text-sm font-bold text-slate-800 mb-2 border-b pb-1">Unidades ABERTAS aos Domingos</h2>
                <div id="listaDomingos" class="grid grid-cols-2 gap-2 max-h-32 overflow-y-auto border p-2 rounded bg-slate-50 custom-scroll text-sm"></div>
            </div>
            <button onclick="salvarConfig()" class="w-full py-2 bg-[#1e3a8a] hover:bg-blue-800 text-white rounded font-bold shadow">💾 Salvar Configurações Globais</button>
            <div class="mt-2 border-t pt-4">
                <h2 class="text-sm font-bold text-slate-800 mb-2 border-b pb-1">Gerenciar Equipe</h2>
                <div id="listaUsuarios" class="flex flex-col gap-2 mb-2 max-h-24 overflow-y-auto border p-2 rounded bg-slate-50 custom-scroll"></div>
                <div class="flex gap-2">
                    <input type="text" id="novoLogin" placeholder="Login" class="flex-1 border border-slate-300 p-2 text-sm rounded text-slate-700">
                    <input type="text" id="novaSenha" placeholder="Senha" class="flex-1 border border-slate-300 p-2 text-sm rounded text-slate-700">
                    <button onclick="criarUsuario()" class="px-4 bg-green-600 text-white rounded font-bold text-sm">Criar</button>
                </div>
            </div>
            <div class="flex justify-end pt-2">
                <button onclick="fecharModal('configModal')" class="px-6 py-2 bg-slate-200 text-slate-700 rounded font-bold hover:bg-slate-300">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Check-in com Atalho Master -->
    <div id="checkinModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-xl w-[450px] border-t-4 border-blue-600">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Check-in de Malote</h2>
            <label class="block text-sm font-medium text-slate-600 mb-1">Data REAL do Recebimento:</label>
            <input type="date" id="dataRecebimento" class="w-full border border-slate-300 p-2 rounded mb-4 text-slate-700">
            
            <label class="block text-sm font-medium text-slate-600 mb-1">Arquivos CSV (Pode selecionar vários):</label>
            <input type="file" id="csvFileInput" accept=".csv" multiple class="w-full border border-slate-300 p-2 rounded mb-4 text-slate-700 cursor-pointer">
            
            <!-- CAIXINHA DE FAST-TRACK (SÓ MASTER) -->
            <label id="lblCheckinFinalizado" class="hidden flex items-center gap-2 mb-6 cursor-pointer text-sm font-bold text-green-700 bg-green-50 p-2 rounded border border-green-200">
                <input type="checkbox" id="chkLancarFinalizado" class="w-4 h-4 text-green-600 rounded">
                Lançar como JÁ FINALIZADO (Histórico antigo)
            </label>

            <div class="flex justify-end gap-2 mt-2">
                <button onclick="fecharModal('checkinModal')" class="px-4 py-2 bg-slate-200 text-slate-700 rounded font-medium">Cancelar</button>
                <button onclick="processarCheckin()" class="px-4 py-2 bg-blue-600 text-white rounded font-bold">Validar CSV(s)</button>
            </div>
        </div>
    </div>

    <main class="flex-1 overflow-hidden p-6 flex flex-col max-w-[1400px] mx-auto w-full">
        <div class="flex flex-wrap gap-4 justify-between items-center bg-white p-4 rounded shadow-sm border border-slate-200 shrink-0">
            <button onclick="abrirModalCheckin()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded shadow transition-transform hover:scale-105 active:scale-95 text-sm font-bold flex items-center gap-2">
                ▶ Iniciar Check-in
            </button>
            
            <div class="flex flex-wrap gap-4 items-center text-sm font-medium">
                <div class="flex gap-3 mr-2 bg-slate-50 p-2 rounded border border-slate-200 shadow-inner">
                    <span class="flex items-center gap-1 text-slate-600 text-xs font-bold"><span class="w-3 h-3 bg-green-500 rounded-sm"></span> No Prazo</span>
                    <span class="flex items-center gap-1 text-slate-600 text-xs font-bold"><span class="w-3 h-3 bg-yellow-400 rounded-sm"></span> Atrasado (Entregue)</span>
                    <span class="flex items-center gap-1 text-slate-600 text-xs font-bold"><span class="w-3 h-3 bg-red-500 rounded-sm"></span> Atrasado (Pendente)</span>
                    <span class="flex items-center gap-1 text-slate-400 text-xs font-bold ml-2"><span class="w-3 h-3 bg-fechado border border-slate-300 rounded-sm"></span> Fechado</span>
                </div>
                
                <select id="filtroAno" class="border border-slate-300 px-3 py-2 rounded text-slate-700 bg-white shadow-sm cursor-pointer"><option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option></select>
                <select id="filtroMes" class="border border-slate-300 px-3 py-2 rounded text-slate-700 bg-white shadow-sm cursor-pointer"><option value="01">Janeiro</option><option value="02">Fevereiro</option><option value="03">Março</option><option value="04">Abril</option><option value="05">Maio</option><option value="06">Junho</option><option value="07">Julho</option><option value="08">Agosto</option><option value="09">Setembro</option><option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option></select>
                <select id="filtroParte" class="border border-slate-300 px-3 py-2 rounded text-slate-700 bg-white shadow-sm cursor-pointer"><option value="1">Parte 1 (Dias 1 a 15)</option><option value="2">Parte 2 (Dias 16 ao fim)</option></select>
            </div>
        </div>

        <div class="mt-4 bg-white rounded shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
            <div class="overflow-x-auto table-scroll flex-1 relative">
                <table class="w-full text-sm text-center border-collapse">
                    <thead class="bg-slate-100 text-slate-600 uppercase text-xs sticky top-0 z-30 shadow-sm" id="matrizHead"></thead>
                    <tbody class="divide-y divide-slate-100" id="matrizBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const supabaseUrl = 'https://gtmcjuwzmzsuifomcodt.supabase.co';
        const supabaseKey = 'sb_publishable_eZ-8tGB15B6lgyHjybJtvA_u2WJsts8';
        const banco = supabase.createClient(supabaseUrl, supabaseKey);

        let usuarioAtual = JSON.parse(sessionStorage.getItem('usuarioLogado'));
        let configGlobal = { data_mestre: new Date().toISOString().split('T')[0], meta_demanda: 400, unidades_domingo: [] };

        function verificarLogin() {
            if (!usuarioAtual) { document.getElementById('loginModal').classList.remove('hidden'); } 
            else {
                document.getElementById('loginModal').classList.add('hidden');
                if (usuarioAtual.perfil === 'master') { 
                    document.getElementById('btnConfig').classList.remove('hidden'); 
                    document.getElementById('lblCheckinFinalizado').classList.remove('hidden');
                } else {
                    document.getElementById('lblCheckinFinalizado').classList.add('hidden');
                }
                iniciarDashboard();
            }
        }

        async function fazerLogin() {
            const user = document.getElementById('loginUser').value; const pass = document.getElementById('loginPass').value;
            const { data } = await banco.from('usuarios').select('*').eq('login', user).eq('senha', pass).single();
            if (data) { usuarioAtual = data; sessionStorage.setItem('usuarioLogado', JSON.stringify(data)); verificarLogin(); } 
            else { alert("Credenciais incorretas."); }
        }

        function fazerLogout() { sessionStorage.removeItem('usuarioLogado'); location.reload(); }

        const mapaUnidades = { "MOEMA EXPRESS": "MOEMA", "OSASCO EXPANSÃO": "OSASCO", "TATUAPE (ALA LILÁS)": "TATUAPE", "ROTINAS EXTERNAS": "EXTERNOS", "PROJETO PAPA BRASIL": "EXTERNOS", "SANTO AMARO NTO": "EXTERNOS", "LABORATÓRIO IMD (GRUPO IGESP / TRANSMONTANO)": "EXTERNOS", "OSASCO - NTO": "EXTERNOS", "COLETA EMPRESAS": "COLETA DOMICILIAR" };
        const unidadesFinais = [ "PARAISO", "PARAISO PREFERENCE", "PARAISO EXPRESS", "MOEMA", "OSASCO", "PERDIZES", "SANTANA", "SANTO AMARO", "MORUMBI", "TATUAPE", "PAULISTA", "VILA OLIMPIA", "EXTERNOS", "COLETA DOMICILIAR" ];
        const feriados2026 = ['2026-01-01', '2026-02-16', '2026-02-17', '2026-04-03', '2026-04-21', '2026-05-01', '2026-06-04', '2026-09-07', '2026-10-12', '2026-11-02', '2026-11-15', '2026-12-25'];
        
        let dadosLocais = [];

        function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }

        async function abrirModalConfig() { 
            document.getElementById('configModal').classList.remove('hidden'); 
            document.getElementById('dataConfig').value = configGlobal.data_mestre;
            document.getElementById('metaDemandaConfig').value = configGlobal.meta_demanda;
            document.getElementById('listaDomingos').innerHTML = unidadesFinais.map(u => `<label class="flex items-center gap-2 p-1 border rounded bg-white hover:bg-blue-50 cursor-pointer transition"><input type="checkbox" value="${u}" class="chk-domingo w-4 h-4 text-blue-600 rounded" ${configGlobal.unidades_domingo.includes(u) ? 'checked' : ''}><span class="text-[11px] font-bold text-slate-700">${u}</span></label>`).join('');
            carregarUsuariosEquipe(); 
        }

        async function salvarConfig() {
            let meta = parseInt(document.getElementById('metaDemandaConfig').value) || 400;
            let dataM = document.getElementById('dataConfig').value;
            let undDom = Array.from(document.querySelectorAll('.chk-domingo:checked')).map(c => c.value);
            await banco.from('configuracoes').update({ data_mestre: dataM, meta_demanda: meta, unidades_domingo: undDom }).eq('id', 1);
            fecharModal('configModal');
        }

        async function carregarUsuariosEquipe() {
            const { data } = await banco.from('usuarios').select('*').neq('perfil', 'master');
            const div = document.getElementById('listaUsuarios');
            if (data && data.length > 0) {
                div.innerHTML = data.map(u => `<div class="flex justify-between items-center bg-white p-2 border rounded"><span class="font-bold text-sm text-slate-700">${u.login}</span><button onclick="excluirUsuario('${u.login}')" class="text-red-500 hover:text-red-700 font-bold text-xs bg-red-50 px-2 py-1 rounded">Excluir</button></div>`).join('');
            } else { div.innerHTML = '<span class="text-xs text-slate-500 italic p-2">Nenhum usuário.</span>'; }
        }

        async function excluirUsuario(loginParaExcluir) { if(confirm(`Excluir usuário: ${loginParaExcluir}?`)) { await banco.from('usuarios').delete().eq('login', loginParaExcluir); carregarUsuariosEquipe(); } }

        async function criarUsuario() {
            const log = document.getElementById('novoLogin').value; const sen = document.getElementById('novaSenha').value;
            if(!log || !sen) return;
            const { error } = await banco.from('usuarios').insert([{ login: log, senha: sen, perfil: 'equipe' }]);
            if(!error) { document.getElementById('novoLogin').value=''; document.getElementById('novaSenha').value=''; carregarUsuariosEquipe(); } else { alert('Erro ao criar usuário.'); }
        }

        function abrirModalCheckin() {
            document.getElementById('dataRecebimento').value = new Date().toISOString().split('T')[0];
            document.getElementById('csvFileInput').value = ""; 
            if(document.getElementById('chkLancarFinalizado')) document.getElementById('chkLancarFinalizado').checked = false;
            document.getElementById('checkinModal').classList.remove('hidden');
        }

        function destacarLinha(elementoClicado) { document.querySelectorAll('tr').forEach(tr => tr.classList.remove('linha-destacada')); elementoClicado.classList.add('linha-destacada'); }
        function obterDiasDoMes(ano, mes) { return new Date(ano, mes, 0).getDate(); }

        function construirMatriz() {
            const ano = document.getElementById('filtroAno').value; const mes = document.getElementById('filtroMes').value; const parte = document.getElementById('filtroParte').value;
            const totalDias = obterDiasDoMes(ano, mes); const diaInicio = parte === "1" ? 1 : 16; const diaFim = parte === "1" ? 15 : totalDias;

            const thead = document.getElementById('matrizHead'); const tbody = document.getElementById('matrizBody');
            
            let thHTML = `<tr><th class="px-4 py-3 text-left w-48 bg-slate-200 border-r-2 border-slate-300 sticky left-0 z-30 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] text-slate-700">Unidade</th>`;
            let diasSemana = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SAB'];
            
            for (let d = diaInicio; d <= diaFim; d++) {
                let dataAux = new Date(ano, parseInt(mes) - 1, d);
                let diaStr = diasSemana[dataAux.getDay()];
                let corDia = dataAux.getDay() === 0 ? 'text-red-500' : 'text-slate-400';
                thHTML += `<th class="px-1 py-2 border-r border-slate-200 w-16 text-center leading-tight"><div class="text-[10px] ${corDia} font-black">${diaStr}</div><div class="text-sm">${d.toString().padStart(2, '0')}</div></th>`;
            }
            thHTML += `</tr>`; thead.innerHTML = thHTML;

            let tbHTML = '';
            unidadesFinais.forEach(unidade => {
                tbHTML += `<tr class="hover:bg-blue-50 transition duration-150 cursor-pointer group" onclick="destacarLinha(this)"><td class="px-4 py-3 font-semibold text-slate-700 text-left border-r-2 border-slate-300 sticky left-0 bg-white shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] group-hover:text-blue-700 z-20">${unidade}</td>`;
                for (let d = diaInicio; d <= diaFim; d++) { tbHTML += `<td id="cel-${unidade.replace(/\s+/g, '')}-${d}" class="border-r border-slate-200 w-16 h-12 relative p-1"></td>`; }
                tbHTML += `</tr>`;
            });
            tbody.innerHTML = tbHTML; preencherMatrizComDados();
        }

        document.getElementById('filtroAno').addEventListener('change', carregarDadosSupabase); document.getElementById('filtroMes').addEventListener('change', carregarDadosSupabase); document.getElementById('filtroParte').addEventListener('change', construirMatriz);

        function normalizarUnidade(nome) { return mapaUnidades[nome.trim().toUpperCase()] || nome.trim().toUpperCase(); }

        function calcularPrazo(dataInicialStr) {
            let strLimpa = dataInicialStr.includes('T') ? dataInicialStr.split('T')[0] : dataInicialStr;
            let data = new Date(strLimpa + "T12:00:00"); let diasAdicionados = 0;
            while (diasAdicionados < 4) {
                data.setDate(data.getDate() + 1);
                if (data.getDay() !== 0 && data.getDay() !== 6 && !feriados2026.includes(data.toISOString().split('T')[0])) { diasAdicionados++; }
            }
            return data;
        }

        async function processarCheckin() {
            const fileInput = document.getElementById('csvFileInput'); const files = fileInput.files;
            const dataRecebimentoReal = document.getElementById('dataRecebimento').value;

            if(files.length === 0) { alert("Anexe pelo menos um arquivo CSV."); return; }
            if(!dataRecebimentoReal) { alert("Escolha a data do recebimento."); return; }

            // Lógica do Fast-Track do Master
            let isFinalizado = document.getElementById('chkLancarFinalizado') && document.getElementById('chkLancarFinalizado').checked;
            let statusDefinido = isFinalizado ? 'FINALIZADO' : 'RECEBIDO';
            let usuarioFim = isFinalizado ? usuarioAtual.login : null;

            let registrosValidos = []; let setAtendimentos = new Set(); let unidadesAviso = new Set();
            let dataRetroativaIso = new Date(dataRecebimentoReal + "T12:00:00").toISOString();

            for (let i = 0; i < files.length; i++) {
                let text = await new Promise((resolve) => { let reader = new FileReader(); reader.readAsText(files[i], 'UTF-16LE'); reader.onload = (e) => resolve(e.target.result.replace(/\0/g, '')); });
                const linhas = text.split(/\r?\n/); if (linhas.length < 2) continue;

                let idxUnidade = -1; let idxAtendimento = -1; let idxDataMalote = -1; let idxGuia = -1; let linhaDadosInicio = 1;
                for(let j = 0; j < Math.min(5, linhas.length); j++) {
                    let colunas = linhas[j].split(';'); 
                    for(let c = 0; c < colunas.length; c++) {
                        let cl = colunas[c].toLowerCase().replace(/[^a-z0-9]/g, '');
                        if(cl === 'unidade') idxUnidade = c; if(cl === 'atendimento') idxAtendimento = c;
                        if(cl === 'guia') idxGuia = c; if(cl === 'dataatendimento' || cl === 'data') idxDataMalote = c;
                    }
                    if(idxUnidade !== -1 && idxAtendimento !== -1) { linhaDadosInicio = j + 1; break; }
                }
                if(idxUnidade === -1 || idxAtendimento === -1) continue;

                for(let j = linhaDadosInicio; j < linhas.length; j++) {
                    if(!linhas[j].trim()) continue; let colunas = linhas[j].split(';');
                    if(colunas.length <= Math.max(idxUnidade, idxAtendimento)) continue;
                    let u = colunas[idxUnidade].replace(/["']/g, '').trim(); let a = colunas[idxAtendimento].replace(/["']/g, '').trim();
                    let g = idxGuia !== -1 ? colunas[idxGuia].replace(/["']/g, '').trim() : "0";
                    let dm = idxDataMalote !== -1 && colunas[idxDataMalote] ? colunas[idxDataMalote].replace(/["']/g, '').trim() : "Não informada";
                    if(!u || !a) continue;
                    
                    let unidadeNorm = normalizarUnidade(u); unidadesAviso.add(unidadeNorm);
                    let id = `${unidadeNorm}-${a}-${g}`;
                    let dataMaloteBanco = dm;
                    if(dm.includes('/')) { let partes = dm.split('/'); if(partes.length === 3) dataMaloteBanco = `${partes[2]}-${partes[1]}-${partes[0]}`; }
                    
                    if (!setAtendimentos.has(id)) {
                        setAtendimentos.add(id);
                        registrosValidos.push({ 
                            id_unico: id, unidade: unidadeNorm, atendimento: a, data_malote: dataMaloteBanco, 
                            data_checkin: dataRetroativaIso, status: statusDefinido, 
                            usuario_checkin: usuarioAtual.login, usuario_finalizacao: usuarioFim
                        });
                    }
                }
            }

            if(registrosValidos.length === 0) { alert("Nenhum dado válido."); return; }
            let uniArray = Array.from(unidadesAviso).join(', ');
            let textoConfirmacao = isFinalizado ? `⚠️ ATENÇÃO: Estes malotes irão DIRETO PARA O HISTÓRICO.\n` : '';
            if(!confirm(`${textoConfirmacao}✅ Processados!\n\n📌 Unidades: ${uniArray}\n📦 Total: ${registrosValidos.length}\n\nConfirmar gravação?`)) { fileInput.value = ''; return; }

            const { error } = await banco.from('malotes').upsert(registrosValidos);
            if(!error) { fecharModal('checkinModal'); carregarDadosSupabase(); } else { alert('Erro ao gravar no banco.'); }
        }

        function extrairDiaDaStringData(dataStr) {
            if(!dataStr) return null;
            if(dataStr.includes('/')) return parseInt(dataStr.split('/')[0], 10);
            if(dataStr.includes('-')) return parseInt(dataStr.split('-')[2].substring(0,2), 10);
            return null;
        }

        async function deletarCheckin(unidade, dataMalote) {
            if(confirm(`CANCELAR check-in de:\nUnidade: ${unidade}\nData Malote: ${dataMalote}?`)) {
                await banco.from('malotes').delete().eq('unidade', unidade).eq('data_malote', dataMalote);
                carregarDadosSupabase();
            }
        }

        // FUNÇÃO NOVA: Força a Finalização via Matriz
        async function forcarFinalizacao(unidade, dataMalote) {
            if(confirm(`ATENÇÃO: Deseja forçar a FINALIZAÇÃO imediata deste malote?\n\nUnidade: ${unidade}\nData Lote: ${dataMalote}`)) {
                const { error } = await banco.from('malotes').update({ 
                    status: 'FINALIZADO', usuario_finalizacao: usuarioAtual.login 
                }).eq('unidade', unidade).eq('data_malote', dataMalote).neq('status', 'FINALIZADO');
                
                if(!error) { carregarDadosSupabase(); } else { alert('Erro ao forçar finalização.'); }
            }
        }

        function preencherMatrizComDados() {
            const ano = document.getElementById('filtroAno').value; const mes = document.getElementById('filtroMes').value; const parte = document.getElementById('filtroParte').value;
            const diaInicio = parte === "1" ? 1 : 16; const diaFim = parte === "1" ? 15 : obterDiasDoMes(ano, mes);
            let inicioOperacao = new Date(configGlobal.data_mestre + "T12:00:00"); let hoje = new Date();

            unidadesFinais.forEach(unidade => {
                for (let d = diaInicio; d <= diaFim; d++) {
                    let idCelula = `cel-${unidade.replace(/\s+/g, '')}-${d}`;
                    let celula = document.getElementById(idCelula);
                    if(!celula) continue;

                    let dataCelulaStr = `${ano}-${mes.padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    let dataCelula = new Date(dataCelulaStr + "T12:00:00");
                    let isDomingo = dataCelula.getDay() === 0;
                    let abreDomingo = configGlobal.unidades_domingo.includes(unidade);

                    if (isDomingo && !abreDomingo) {
                        celula.innerHTML = `<div class="w-full h-full bg-fechado rounded border border-slate-200" title="Fechado aos Domingos"></div>`;
                        continue; 
                    }

                    if (dataCelula >= inicioOperacao) {
                        let dataPrazo = calcularPrazo(dataCelulaStr); dataPrazo.setHours(23, 59, 59, 999);
                        if (hoje > dataPrazo) { celula.innerHTML = `<div class="w-full h-full bg-red-500 rounded shadow-sm opacity-85 border border-red-600" title="Atrasado (Prazo era: ${dataPrazo.toLocaleDateString('pt-BR')})"></div>`; } 
                        else { celula.innerHTML = `<div class="w-full h-full bg-slate-50 border border-slate-100 rounded opacity-60" title="Aguardando (No prazo até: ${dataPrazo.toLocaleDateString('pt-BR')})"></div>`; }
                    } else { celula.innerHTML = ''; }
                }
            });

            let malotesAgrupados = {};
            dadosLocais.forEach(linha => {
                let diaMalote = extrairDiaDaStringData(linha.data_malote);
                if(diaMalote >= diaInicio && diaMalote <= diaFim) {
                    let chave = `${linha.unidade}-${diaMalote}`;
                    if(!malotesAgrupados[chave]) { 
                        malotesAgrupados[chave] = { 
                            unidade: linha.unidade, diaMalote: diaMalote, data_malote: linha.data_malote, 
                            data_checkin: linha.data_checkin, quantidade: 0, usuarios: new Set(),
                            statusArray: [] // Array para analisar se está tudo finalizado
                        }; 
                    }
                    malotesAgrupados[chave].quantidade++; 
                    malotesAgrupados[chave].usuarios.add(linha.usuario_checkin);
                    malotesAgrupados[chave].statusArray.push(linha.status);
                }
            });

            Object.values(malotesAgrupados).forEach(grupo => {
                let idCelula = `cel-${grupo.unidade.replace(/\s+/g, '')}-${grupo.diaMalote}`;
                let celula = document.getElementById(idCelula);
                
                if(celula && celula.innerHTML !== '') {
                    let dataCheckin = new Date(grupo.data_checkin);
                    let dataCelulaStr = `${ano}-${mes.padStart(2,'0')}-${String(grupo.diaMalote).padStart(2,'0')}`;
                    let prazoDesteMalote = calcularPrazo(dataCelulaStr); prazoDesteMalote.setHours(23, 59, 59, 999);

                    let corFundo = (dataCheckin <= prazoDesteMalote) ? 'bg-green-500 border-green-600' : 'bg-yellow-400 border-yellow-500';
                    let diaEntrega = dataCheckin.getDate().toString().padStart(2, '0'); let mesEntrega = (dataCheckin.getMonth() + 1).toString().padStart(2, '0');
                    
                    let podeDeletar = usuarioAtual.perfil === 'master' || grupo.usuarios.has(usuarioAtual.login);
                    let isTotalmenteFinalizado = grupo.statusArray.every(s => s === 'FINALIZADO' || s === 'AUSENTE');

                    let btnDelete = podeDeletar ? `<button onclick="deletarCheckin('${grupo.unidade}', '${grupo.data_malote}')" class="hidden group-hover:flex absolute -top-1.5 -right-1.5 bg-red-600 text-white rounded-full w-5 h-5 items-center justify-center text-[10px] font-bold shadow-lg hover:bg-red-800 transition z-20" title="Excluir (Desfazer Check-in)">✕</button>` : '';
                    
                    // BOTÃO NOVO (SÓ MASTER)
                    let btnForcarFim = (usuarioAtual.perfil === 'master' && !isTotalmenteFinalizado) ? `<button onclick="forcarFinalizacao('${grupo.unidade}', '${grupo.data_malote}')" class="hidden group-hover:flex absolute -top-1.5 -left-1.5 bg-green-500 text-white rounded-full w-5 h-5 items-center justify-center text-[10px] font-bold shadow-lg hover:bg-green-700 transition z-20" title="Forçar Finalização Deste Malote">✔</button>` : '';
                    
                    // SELO DE CONCLUSÃO VISUAL
                    let seloConcluido = isTotalmenteFinalizado ? `<div class="absolute -bottom-1.5 -right-1.5 bg-green-700 rounded-full w-4 h-4 flex items-center justify-center text-[10px] border-2 border-white shadow-sm z-10" title="Malote Totalmente Finalizado">✔</div>` : '';

                    celula.innerHTML = `
                        <div class="w-full h-full ${corFundo} border rounded shadow-md opacity-100 flex flex-col items-center justify-center text-white relative group p-0.5 transition-transform hover:scale-105 z-10" title="Entrega: ${diaEntrega}/${mesEntrega}\nQtd: ${grupo.quantidade}">
                            <span class="text-[9px] leading-tight font-medium opacity-90">${diaEntrega}/${mesEntrega}</span>
                            <span class="text-[12px] font-bold leading-tight drop-shadow-md">${grupo.quantidade}</span>
                            ${btnForcarFim}
                            ${btnDelete}
                            ${seloConcluido}
                        </div>
                    `;
                }
            });
        }

        async function carregarDadosSupabase() {
            const ano = document.getElementById('filtroAno').value; const mes = document.getElementById('filtroMes').value;
            const ultimoDia = new Date(ano, parseInt(mes), 0).getDate();
            const dataInicio = `${ano}-${mes}-01`; const dataFim = `${ano}-${mes}-${String(ultimoDia).padStart(2, '0')}`;
            
            let todosDados = []; let from = 0; const step = 1000;
            while (true) {
                const { data, error } = await banco.from('malotes').select('*').gte('data_malote', dataInicio).lte('data_malote', dataFim).range(from, from + step - 1);
                if (error) break; if (data && data.length > 0) todosDados.push(...data);
                if (!data || data.length < step) break; from += step;
            }
            dadosLocais = todosDados; construirMatriz(); 
        }

        let debounceTimer;
        banco.channel('canal-malotes').on('postgres_changes', { event: '*', schema: 'public', table: 'malotes' }, payload => {
            clearTimeout(debounceTimer); debounceTimer = setTimeout(() => { carregarDadosSupabase(); }, 500);
        }).subscribe();
        
        banco.channel('canal-config').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'configuracoes' }, payload => {
            configGlobal.data_mestre = payload.new.data_mestre; configGlobal.meta_demanda = payload.new.meta_demanda; configGlobal.unidades_domingo = payload.new.unidades_domingo;
            construirMatriz(); 
        }).subscribe();

        function definirFiltrosAtuais() {
            const hoje = new Date(); const ano = hoje.getFullYear().toString(); const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = hoje.getDate(); const parte = dia > 15 ? "2" : "1";
            document.getElementById('filtroAno').value = ano; document.getElementById('filtroMes').value = mes; document.getElementById('filtroParte').value = parte;
        }

        async function iniciarDashboard() {
            definirFiltrosAtuais(); construirMatriz(); 
            const { data } = await banco.from('configuracoes').select('*').eq('id', 1).single();
            if(data) { configGlobal.data_mestre = data.data_mestre; configGlobal.meta_demanda = data.meta_demanda || 400; configGlobal.unidades_domingo = data.unidades_domingo || []; }
            await carregarDadosSupabase();
        }

        verificarLogin();
    </script>
</body>
</html>
