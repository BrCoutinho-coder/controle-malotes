<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Malotes - Operação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-scroll::-webkit-scrollbar { height: 8px; }
        .table-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .linha-destacada { background-color: #eff6ff !important; outline: 2px solid #3b82f6; z-index: 10; position: relative; }
        .cursor-pointer { cursor: pointer; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col">

    <div id="loginModal" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center transition-opacity">
        <div class="bg-white p-8 rounded shadow-2xl w-96 flex flex-col">
            <h2 class="text-2xl font-black text-[#1e3a8a] mb-2 text-center">Acesso Restrito</h2>
            <p class="text-sm text-slate-500 mb-6 text-center">Identifique-se para acessar a operação.</p>
            <input type="text" id="loginUser" placeholder="Usuário" class="border border-slate-300 p-3 rounded mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" id="loginPass" placeholder="Senha" class="border border-slate-300 p-3 rounded mb-6 focus:ring-2 focus:ring-blue-500 outline-none" onkeypress="if(event.key === 'Enter') fazerLogin()">
            <button onclick="fazerLogin()" class="bg-[#1e3a8a] hover:bg-blue-800 text-white font-bold py-3 rounded shadow transition-transform active:scale-95">Entrar</button>
        </div>
    </div>

    <header class="bg-[#1e3a8a] text-white p-4 shadow-md flex justify-between items-center shrink-0">
        <h1 class="text-xl font-bold tracking-wide">Controle de Malotes</h1>
        <div class="flex gap-4 items-center">
            <a href="demanda.html" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm font-bold shadow border border-blue-400 transition-transform hover:scale-105 active:scale-95 flex items-center gap-2">
                📊 Painel de Demanda
            </a>
            <button id="btnConfig" onclick="abrirModalConfig()" class="hidden hover:text-blue-200 text-2xl transition-transform hover:scale-110 active:scale-95" title="Configurações (Master)">⚙️</button>
            <button onclick="fazerLogout()" class="text-sm bg-red-600 hover:bg-red-500 px-3 py-2 rounded font-bold shadow ml-2">Sair</button>
        </div>
    </header>

    <div id="configModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-xl w-96 flex flex-col gap-6 max-h-[90vh] overflow-y-auto">
            
            <div>
                <h2 class="text-lg font-bold text-slate-800 mb-2 border-b pb-1">Data Mestre</h2>
                <input type="date" id="dataConfig" class="w-full border border-slate-300 p-2 rounded mb-2 text-slate-700">
                <button onclick="salvarConfig()" class="w-full py-2 bg-[#1e3a8a] text-white rounded font-bold">Salvar Data</button>
            </div>

            <div>
                <h2 class="text-lg font-bold text-slate-800 mb-2 border-b pb-1">Criar Usuário da Equipe</h2>
                <input type="text" id="novoLogin" placeholder="Login do Funcionário" class="w-full border border-slate-300 p-2 rounded mb-2 text-slate-700">
                <input type="text" id="novaSenha" placeholder="Senha" class="w-full border border-slate-300 p-2 rounded mb-2 text-slate-700">
                <button onclick="criarUsuario()" class="w-full py-2 bg-green-600 text-white rounded font-bold">Cadastrar</button>
            </div>

            <div class="flex justify-end pt-4 border-t">
                <button onclick="fecharModal('configModal')" class="px-4 py-2 bg-slate-200 text-slate-700 rounded font-bold">Fechar</button>
            </div>
        </div>
    </div>

    <div id="checkinModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-xl w-96 border-t-4 border-blue-600">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Check-in de Malote</h2>
            <label class="block text-sm font-medium text-slate-600 mb-1">Data REAL do Recebimento:</label>
            <input type="date" id="dataRecebimento" class="w-full border border-slate-300 p-2 rounded mb-4 text-slate-700">
            <label class="block text-sm font-medium text-slate-600 mb-1">Arquivo CSV do Sistema:</label>
            <input type="file" id="csvFileInput" accept=".csv" class="w-full border border-slate-300 p-2 rounded mb-6 text-slate-700">
            <div class="flex justify-end gap-2">
                <button onclick="fecharModal('checkinModal')" class="px-4 py-2 bg-slate-200 text-slate-700 rounded font-medium">Cancelar</button>
                <button onclick="processarCheckin()" class="px-4 py-2 bg-blue-600 text-white rounded font-bold">Validar CSV</button>
            </div>
        </div>
    </div>

    <main class="flex-1 overflow-hidden p-6 flex flex-col max-w-[1400px] mx-auto w-full">
        <div class="flex flex-wrap gap-4 justify-between items-center bg-white p-4 rounded shadow-sm border border-slate-200 shrink-0">
            <button onclick="abrirModalCheckin()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded shadow transition-transform hover:scale-105 active:scale-95 text-sm font-bold flex items-center gap-2">
                ▶ Iniciar Check-in
            </button>
            
            <div class="flex flex-wrap gap-4 items-center text-sm font-medium">
                <div class="flex gap-3 mr-2 bg-slate-50 p-2 rounded border border-slate-200 shadow-inner">
                    <span class="flex items-center gap-1 text-slate-600 text-xs font-bold"><span class="w-3 h-3 bg-green-500 rounded-sm"></span> No Prazo</span>
                    <span class="flex items-center gap-1 text-slate-600 text-xs font-bold"><span class="w-3 h-3 bg-yellow-400 rounded-sm"></span> Atrasado (Entregue)</span>
                    <span class="flex items-center gap-1 text-slate-600 text-xs font-bold"><span class="w-3 h-3 bg-red-500 rounded-sm"></span> Atrasado (Pendente)</span>
                </div>
                
                <select id="filtroAno" class="border border-slate-300 px-3 py-2 rounded text-slate-700 bg-white shadow-sm cursor-pointer"><option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option></select>
                <select id="filtroMes" class="border border-slate-300 px-3 py-2 rounded text-slate-700 bg-white shadow-sm cursor-pointer"><option value="01">Janeiro</option><option value="02">Fevereiro</option><option value="03">Março</option><option value="04">Abril</option><option value="05">Maio</option><option value="06">Junho</option><option value="07">Julho</option><option value="08">Agosto</option><option value="09">Setembro</option><option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option></select>
                <select id="filtroParte" class="border border-slate-300 px-3 py-2 rounded text-slate-700 bg-white shadow-sm cursor-pointer"><option value="1">Parte 1 (Dias 1 a 15)</option><option value="2">Parte 2 (Dias 16 ao fim)</option></select>
            </div>
        </div>

        <div class="mt-4 bg-white rounded shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
            <div class="overflow-x-auto table-scroll flex-1 relative">
                <table class="w-full text-sm text-center border-collapse">
                    <thead class="bg-slate-100 text-slate-600 uppercase text-xs sticky top-0 z-30 shadow-sm" id="matrizHead"></thead>
                    <tbody class="divide-y divide-slate-100" id="matrizBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const supabaseUrl = 'https://gtmcjuwzmzsuifomcodt.supabase.co';
        const supabaseKey = 'sb_publishable_eZ-8tGB15B6lgyHjybJtvA_u2WJsts8';
        const banco = supabase.createClient(supabaseUrl, supabaseKey);

        let usuarioAtual = JSON.parse(sessionStorage.getItem('usuarioLogado'));

        // ==========================================
        // 1. SISTEMA DE LOGIN
        // ==========================================
        function verificarLogin() {
            if (!usuarioAtual) {
                document.getElementById('loginModal').classList.remove('hidden');
            } else {
                document.getElementById('loginModal').classList.add('hidden');
                if (usuarioAtual.perfil === 'master') {
                    document.getElementById('btnConfig').classList.remove('hidden');
                }
                iniciarDashboard();
            }
        }

        async function fazerLogin() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            
            const { data, error } = await banco.from('usuarios').select('*').eq('login', user).eq('senha', pass).single();
            if (data) {
                usuarioAtual = data;
                sessionStorage.setItem('usuarioLogado', JSON.stringify(data));
                verificarLogin();
            } else {
                alert("Credenciais incorretas.");
            }
        }

        function fazerLogout() {
            sessionStorage.removeItem('usuarioLogado');
            location.reload();
        }

        async function criarUsuario() {
            const log = document.getElementById('novoLogin').value;
            const sen = document.getElementById('novaSenha').value;
            if(!log || !sen) return;
            const { error } = await banco.from('usuarios').insert([{ login: log, senha: sen, perfil: 'equipe' }]);
            if(!error) { alert('Usuário criado!'); document.getElementById('novoLogin').value=''; document.getElementById('novaSenha').value=''; }
            else { alert('Erro ao criar usuário.'); }
        }

        const mapaUnidades = { "MOEMA EXPRESS": "MOEMA", "OSASCO EXPANSÃO": "OSASCO", "TATUAPE (ALA LILÁS)": "TATUAPE", "ROTINAS EXTERNAS": "EXTERNOS", "PROJETO PAPA BRASIL": "EXTERNOS", "SANTO AMARO NTO": "EXTERNOS", "LABORATÓRIO IMD (GRUPO IGESP / TRANSMONTANO)": "EXTERNOS", "OSASCO - NTO": "EXTERNOS", "COLETA EMPRESAS": "COLETA DOMICILIAR" };
        const unidadesFinais = [ "PARAISO", "PARAISO PREFERENCE", "PARAISO EXPRESS", "MOEMA", "OSASCO", "PERDIZES", "SANTANA", "SANTO AMARO", "MORUMBI", "TATUAPE", "PAULISTA", "VILA OLIMPIA", "EXTERNOS", "COLETA DOMICILIAR" ];
        const feriados2026 = ['2026-01-01', '2026-02-16', '2026-02-17', '2026-04-03', '2026-04-21', '2026-05-01', '2026-06-04', '2026-09-07', '2026-10-12', '2026-11-02', '2026-11-15', '2026-12-25'];
        
        let dadosLocais = [];
        let dataMestreGlobal = new Date().toISOString().split('T')[0];

        function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }
        function abrirModalConfig() { document.getElementById('configModal').classList.remove('hidden'); }
        async function salvarConfig() {
            const novaData = document.getElementById('dataConfig').value;
            await banco.from('configuracoes').update({ data_mestre: novaData }).eq('id', 1);
            fecharModal('configModal');
        }

        function abrirModalCheckin() {
            document.getElementById('dataRecebimento').value = new Date().toISOString().split('T')[0];
            document.getElementById('csvFileInput').value = "";
            document.getElementById('checkinModal').classList.remove('hidden');
        }

        function destacarLinha(elementoClicado) {
            document.querySelectorAll('tr').forEach(tr => tr.classList.remove('linha-destacada'));
            elementoClicado.classList.add('linha-destacada');
        }

        function obterDiasDoMes(ano, mes) { return new Date(ano, mes, 0).getDate(); }

        function construirMatriz() {
            const ano = document.getElementById('filtroAno').value;
            const mes = document.getElementById('filtroMes').value;
            const parte = document.getElementById('filtroParte').value;
            
            const totalDias = obterDiasDoMes(ano, mes);
            const diaInicio = parte === "1" ? 1 : 16;
            const diaFim = parte === "1" ? 15 : totalDias;

            const thead = document.getElementById('matrizHead');
            const tbody = document.getElementById('matrizBody');
            
            let thHTML = `<tr><th class="px-4 py-3 text-left w-48 bg-slate-200 border-r-2 border-slate-300 sticky left-0 z-30 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] text-slate-700">Unidade</th>`;
            for (let d = diaInicio; d <= diaFim; d++) thHTML += `<th class="px-2 py-3 border-r border-slate-200 w-16">${d.toString().padStart(2, '0')}</th>`;
            thHTML += `</tr>`;
            thead.innerHTML = thHTML;

            let tbHTML = '';
            unidadesFinais.forEach(unidade => {
                tbHTML += `<tr class="hover:bg-blue-50 transition duration-150 cursor-pointer group" onclick="destacarLinha(this)">
                            <td class="px-4 py-3 font-semibold text-slate-700 text-left border-r-2 border-slate-300 sticky left-0 bg-white shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] group-hover:text-blue-700 z-20">${unidade}</td>`;
                for (let d = diaInicio; d <= diaFim; d++) { tbHTML += `<td id="cel-${unidade.replace(/\s+/g, '')}-${d}" class="border-r border-slate-200 w-16 h-12 relative p-1"></td>`; }
                tbHTML += `</tr>`;
            });
            tbody.innerHTML = tbHTML;
            preencherMatrizComDados();
        }

        document.getElementById('filtroAno').addEventListener('change', carregarDadosSupabase);
        document.getElementById('filtroMes').addEventListener('change', carregarDadosSupabase);
        document.getElementById('filtroParte').addEventListener('change', construirMatriz);

        function normalizarUnidade(nome) { return mapaUnidades[nome.trim().toUpperCase()] || nome.trim().toUpperCase(); }

        function calcularPrazo(dataInicialStr) {
            let strLimpa = dataInicialStr.includes('T') ? dataInicialStr.split('T')[0] : dataInicialStr;
            let data = new Date(strLimpa + "T12:00:00"); 
            let diasAdicionados = 0;
            while (diasAdicionados < 5) {
                data.setDate(data.getDate() + 1);
                let diaSemana = data.getDay();
                let dataFormatada = data.toISOString().split('T')[0];
                if (diaSemana !== 0 && diaSemana !== 6 && !feriados2026.includes(dataFormatada)) { diasAdicionados++; }
            }
            return data;
        }

        function processarCheckin() {
            const fileInput = document.getElementById('csvFileInput');
            const file = fileInput.files[0];
            const dataRecebimentoReal = document.getElementById('dataRecebimento').value;

            if(!file) { alert("Anexe o arquivo."); return; }
            const reader = new FileReader();
            reader.readAsText(file, 'UTF-16LE'); 
            
            reader.onload = async function(e) {
                const text = e.target.result.replace(/\0/g, '');
                const linhas = text.split(/\r?\n/);
                if (linhas.length < 2) return;

                let idxUnidade = -1; let idxAtendimento = -1; let idxDataMalote = -1; let linhaDadosInicio = 1;
                for(let i = 0; i < Math.min(5, linhas.length); i++) {
                    let colunas = linhas[i].split(';'); 
                    for(let c = 0; c < colunas.length; c++) {
                        let celulaLimpa = colunas[c].toLowerCase().replace(/[^a-z0-9]/g, '');
                        if(celulaLimpa === 'unidade') idxUnidade = c;
                        if(celulaLimpa === 'atendimento') idxAtendimento = c;
                        if(celulaLimpa === 'dataatendimento' || celulaLimpa === 'data') idxDataMalote = c;
                    }
                    if(idxUnidade !== -1 && idxAtendimento !== -1) { linhaDadosInicio = i + 1; break; }
                }

                let registrosValidos = [];
                let setAtendimentos = new Set();
                let dataRetroativaIso = new Date(dataRecebimentoReal + "T12:00:00").toISOString();

                for(let i = linhaDadosInicio; i < linhas.length; i++) {
                    if(!linhas[i].trim()) continue; 
                    let colunas = linhas[i].split(';');
                    if(colunas.length <= Math.max(idxUnidade, idxAtendimento)) continue;

                    let u = colunas[idxUnidade].replace(/["']/g, '').trim();
                    let a = colunas[idxAtendimento].replace(/["']/g, '').trim();
                    let dm = idxDataMalote !== -1 && colunas[idxDataMalote] ? colunas[idxDataMalote].replace(/["']/g, '').trim() : "Não informada";

                    if(!u || !a) continue;
                    let unidadeNorm = normalizarUnidade(u);
                    let id = `${unidadeNorm}-${a}`;
                    
                    let dataMaloteBanco = dm;
                    if(dm.includes('/')) { let partes = dm.split('/'); if(partes.length === 3) dataMaloteBanco = `${partes[2]}-${partes[1]}-${partes[0]}`; }
                    
                    if (!setAtendimentos.has(id)) {
                        setAtendimentos.add(id);
                        registrosValidos.push({
                            id_unico: id, unidade: unidadeNorm, atendimento: a, data_malote: dataMaloteBanco, 
                            data_checkin: dataRetroativaIso, status: "RECEBIDO",
                            usuario_checkin: usuarioAtual.login // GRAVANDO A AUDITORIA
                        });
                    }
                }

                if(!confirm(`✅ Processado. Total: ${registrosValidos.length}\nConfirmar gravação?`)) { fileInput.value = ''; return; }

                const { error } = await banco.from('malotes').upsert(registrosValidos);
                if(!error) { fecharModal('checkinModal'); } else { alert('Erro ao gravar no banco.'); }
            };
        }

        function extrairDiaDaStringData(dataStr) {
            if(!dataStr) return null;
            if(dataStr.includes('/')) return parseInt(dataStr.split('/')[0], 10);
            if(dataStr.includes('-')) return parseInt(dataStr.split('-')[2].substring(0,2), 10);
            return null;
        }

        async function deletarCheckin(unidade, dataMalote) {
            if(confirm(`CANCELAR o check-in de:\nUnidade: ${unidade}\nData Malote: ${dataMalote}?`)) {
                await banco.from('malotes').delete().eq('unidade', unidade).eq('data_malote', dataMalote);
            }
        }

        function preencherMatrizComDados() {
            const ano = document.getElementById('filtroAno').value;
            const mes = document.getElementById('filtroMes').value;
            const parte = document.getElementById('filtroParte').value;
            
            const diaInicio = parte === "1" ? 1 : 16;
            const diaFim = parte === "1" ? 15 : obterDiasDoMes(ano, mes);

            let inicioOperacao = new Date(dataMestreGlobal + "T12:00:00");
            let hoje = new Date();

            unidadesFinais.forEach(unidade => {
                for (let d = diaInicio; d <= diaFim; d++) {
                    let idCelula = `cel-${unidade.replace(/\s+/g, '')}-${d}`;
                    let celula = document.getElementById(idCelula);
                    if(!celula) continue;

                    let dataCelulaStr = `${ano}-${mes.padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    let dataCelula = new Date(dataCelulaStr + "T12:00:00");

                    if (dataCelula >= inicioOperacao) {
                        let dataPrazo = calcularPrazo(dataCelulaStr);
                        dataPrazo.setHours(23, 59, 59, 999);
                        if (hoje > dataPrazo) {
                            celula.innerHTML = `<div class="w-full h-full bg-red-500 rounded shadow-sm opacity-85 cursor-not-allowed border border-red-600"></div>`;
                        } else {
                            celula.innerHTML = `<div class="w-full h-full bg-slate-50 border border-slate-100 rounded opacity-60"></div>`;
                        }
                    } else { celula.innerHTML = ''; }
                }
            });

            let malotesAgrupados = {};
            dadosLocais.forEach(linha => {
                let diaMalote = extrairDiaDaStringData(linha.data_malote);
                if(diaMalote >= diaInicio && diaMalote <= diaFim) {
                    let chave = `${linha.unidade}-${diaMalote}`;
                    if(!malotesAgrupados[chave]) {
                        malotesAgrupados[chave] = { unidade: linha.unidade, diaMalote: diaMalote, data_malote: linha.data_malote, data_checkin: linha.data_checkin, quantidade: 0 };
                    }
                    malotesAgrupados[chave].quantidade++;
                }
            });

            Object.values(malotesAgrupados).forEach(grupo => {
                let idCelula = `cel-${grupo.unidade.replace(/\s+/g, '')}-${grupo.diaMalote}`;
                let celula = document.getElementById(idCelula);
                
                if(celula && celula.innerHTML !== '') {
                    let dataCheckin = new Date(grupo.data_checkin);
                    let dataCelulaStr = `${ano}-${mes.padStart(2,'0')}-${String(grupo.diaMalote).padStart(2,'0')}`;
                    let prazoDesteMalote = calcularPrazo(dataCelulaStr);
                    prazoDesteMalote.setHours(23, 59, 59, 999);

                    let corFundo = (dataCheckin <= prazoDesteMalote) ? 'bg-green-500 border-green-600' : 'bg-yellow-400 border-yellow-500';
                    let diaEntrega = dataCheckin.getDate().toString().padStart(2, '0');
                    let mesEntrega = (dataCheckin.getMonth() + 1).toString().padStart(2, '0');

                    celula.innerHTML = `
                        <div class="w-full h-full ${corFundo} border rounded shadow-md opacity-100 flex flex-col items-center justify-center text-white relative group p-0.5 transition-transform hover:scale-105 z-10" title="Entrega: ${diaEntrega}/${mesEntrega}\nQtd: ${grupo.quantidade}">
                            <span class="text-[9px] leading-tight font-medium opacity-90">${diaEntrega}/${mesEntrega}</span>
                            <span class="text-[12px] font-bold leading-tight drop-shadow-md">${grupo.quantidade}</span>
                            <button onclick="deletarCheckin('${grupo.unidade}', '${grupo.data_malote}')" class="hidden group-hover:flex absolute -top-1.5 -right-1.5 bg-red-600 text-white rounded-full w-5 h-5 items-center justify-center text-[10px] font-bold shadow-lg hover:bg-red-800 transition z-20">✕</button>
                        </div>
                    `;
                }
            });
        }

        async function carregarDadosSupabase() {
            const ano = document.getElementById('filtroAno').value;
            const mes = document.getElementById('filtroMes').value;
            const ultimoDia = new Date(ano, parseInt(mes), 0).getDate();
            const dataInicio = `${ano}-${mes}-01`;
            const dataFim = `${ano}-${mes}-${String(ultimoDia).padStart(2, '0')}`;
            
            const { data, error } = await banco.from('malotes').select('*').gte('data_malote', dataInicio).lte('data_malote', dataFim);
            if(!error && data) { dadosLocais = data; construirMatriz(); }
        }

        let debounceTimer;
        banco.channel('canal-malotes').on('postgres_changes', { event: '*', schema: 'public', table: 'malotes' }, payload => {
            clearTimeout(debounceTimer); debounceTimer = setTimeout(() => { carregarDadosSupabase(); }, 500);
        }).subscribe();
        
        banco.channel('canal-config').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'configuracoes' }, payload => {
            dataMestreGlobal = payload.new.data_mestre; document.getElementById('dataConfig').value = dataMestreGlobal; construirMatriz(); 
        }).subscribe();

        function definirFiltrosAtuais() {
            const hoje = new Date();
            const ano = hoje.getFullYear().toString();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = hoje.getDate();
            const parte = dia > 15 ? "2" : "1";
            document.getElementById('filtroAno').value = ano;
            document.getElementById('filtroMes').value = mes;
            document.getElementById('filtroParte').value = parte;
        }

        async function iniciarDashboard() {
            definirFiltrosAtuais(); construirMatriz(); 
            const { data } = await banco.from('configuracoes').select('data_mestre').eq('id', 1).single();
            if(data) dataMestreGlobal = data.data_mestre;
            document.getElementById('dataConfig').value = dataMestreGlobal;
            await carregarDadosSupabase();
        }

        // INIT
        verificarLogin();
    </script>
</body>
</html>
